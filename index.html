<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Расписание">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> расписание</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <!-- Tesseract.js для локального OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
    <header class="app-header">
        <h1 id="page-title">Расписание</h1>
        <button id="btn-upload" class="icon-btn">📷</button>
    </header>

    <main id="app-container">
        <!-- Вид: Главное расписание -->
        <section id="view-home" class="view active">
            <div id="smart-card" class="smart-card">
                <div class="smart-card-header">Сейчас</div>
                <div id="smart-card-content" class="smart-card-content">Загрузка...</div>
            </div>

            <div class="week-toggle">
                <button class="toggle-btn active" data-week="odd">Нечетная</button>
                <button class="toggle-btn" data-week="even">Четная</button>
            </div>

            <div id="day-tabs" class="day-tabs"></div>
            <div id="lessons-list" class="lessons-list"></div>
            
            <button id="btn-edit-manual" class="btn-secondary">✏️ Редактировать вручную</button>
        </section>

        <!-- Вид: Загрузка фото -->
        <section id="view-upload" class="view">
            <div class="upload-area">
                <p>Загрузите фото расписания</p>
                <input type="file" id="file-input" accept="image/*">
                <label for="file-input" class="upload-label">📷 Выбрать фото</label>
            </div>
            <div id="ocr-progress" class="ocr-progress hidden">
                <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
                <p id="progress-text">Распознавание: 0%</p>
            </div>
            <button id="btn-cancel-upload" class="btn-text">Отмена</button>
        </section>

        <!-- Вид: Редактор -->
        <section id="view-editor" class="view">
            <div class="editor-header">
                <div class="day-selector">
                    <button class="day-btn" data-day="1">Пн</button>
                    <button class="day-btn" data-day="2">Вт</button>
                    <button class="day-btn" data-day="3">Ср</button>
                    <button class="day-btn" data-day="4">Чт</button>
                    <button class="day-btn" data-day="5">Пт</button>
                    <button class="day-btn" data-day="6">Сб</button>
                </div>
                <button id="btn-add-lesson" class="add-lesson-btn">
                    <span class="icon">＋</span>
                    <span>Урок</span>
                </button>
            </div>
            <div id="editor-list"></div>
            <div class="editor-actions">
                <button id="btn-save-editor" class="btn-primary">💾 Сохранить</button>
                <button id="btn-cancel-editor" class="btn-text">Отмена</button>
            </div>
        </section>
    </main>

    <!-- Скрипты -->
    <script src="data.js"></script>
    <script src="parser.js"></script>
    <script src="ocr.js"></script>
    <script src="editor.js"></script>
    <script src="render.js"></script>
    <script src="app.js"></script>
</body>
</html>
